name: Joãozinho Review

# Fires when @joaocarvoli is requested as a reviewer. All logic and the review
# spec live in shemaobt/.github — edit there, not here.

on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: joaozinho-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  joaozinho:
    uses: shemaobt/.github/.github/workflows/joaozinho-review.yml@main
    with:
      lens_pack: flutter-dart
      # Raised with shema-api's: the reusable workflow's 40 was measured on smaller
      # pull requests than the ones this repo now gets (ENG-1692: #374 and #376 both
      # ended in error_max_turns with no review posted).
      max_turns: 60
      app_id: ${{ vars.JOAOZINHO_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.JOAOZINHO_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
