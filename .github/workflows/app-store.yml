name: App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare the version with the previous commit's
        id: version
        run: bash tool/release_gate.sh HEAD~1 HEAD >> "$GITHUB_OUTPUT"

  build-and-submit:
    needs: gate
    if: needs.gate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Create .env for build
        run: echo 'BACKEND_URL=https://tripod-backend.shemaywam.com' > .env

      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          cd ios && pod install && cd ..

      - name: Import signing certificate
        env:
          CERTIFICATES_P12_BASE64: ${{ secrets.CERTIFICATES_P12_BASE64 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATES_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERTIFICATES_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Set up App Store Connect API key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          echo "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          KEY_PATH="$KEY_PATH" python3 -c "import json,os; print(json.dumps({'key_id':os.environ['APPSTORE_API_KEY_ID'],'issuer_id':os.environ['APPSTORE_ISSUER_ID'],'key':open(os.environ['KEY_PATH']).read(),'in_house':False}))" > "$RUNNER_TEMP/asc_api_key.json"
          echo "ASC_KEY_JSON=$RUNNER_TEMP/asc_api_key.json" >> "$GITHUB_ENV"

      - name: Resolve version
        run: echo "APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')" >> "$GITHUB_ENV"

      - name: Fetch the App Store provisioning profile (fastlane sigh, via API key)
        run: |
          fastlane sigh --api_key_path "$ASC_KEY_JSON" \
            --app_identifier com.shema.internalizationRoom \
            --provisioning_name "IR App Store CI" \
            --platform ios --force

      - name: Configure manual signing
        run: |
          fastlane run update_code_signing_settings \
            path:"ios/Runner.xcodeproj" use_automatic_signing:false team_id:"55ZKR3YQMJ" \
            targets:"Runner" profile_name:"IR App Store CI" code_sign_identity:"Apple Distribution"

      - name: Generate Flutter Xcode config (no build)
        run: |
          flutter build ios --release --config-only --obfuscate --split-debug-info=build/symbols \
            --dart-define=BUILD_NUMBER="$BUILD_NUMBER"

      - name: Archive (manual signing with the fetched profile)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"

      - name: Keep the Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-dart-symbols
          path: build/symbols
          retention-days: 90

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload and submit for review (fastlane deliver)
        run: |
          fastlane run deliver \
            api_key_path:"$ASC_KEY_JSON" \
            app_identifier:"com.shema.internalizationRoom" \
            ipa:"$(ls "$RUNNER_TEMP"/ipa/*.ipa)" \
            app_version:"$APP_VERSION" \
            build_number:"$BUILD_NUMBER" \
            metadata_path:"fastlane/metadata" \
            skip_screenshots:true \
            skip_metadata:false \
            submit_for_review:true \
            automatic_release:false \
            force:true \
            precheck_include_in_app_purchases:false \
            submission_information:'{"export_compliance_uses_encryption":false}'
