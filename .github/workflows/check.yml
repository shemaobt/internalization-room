name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Provide a .env
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded --coverage

      # Three skipped tests sat green for weeks, one with an empty body and a reason that
      # had stopped being true. A paused test is a decision, and a decision belongs in a
      # review — not in a suite that reports success.
      - name: No test is quietly skipped
        run: |
          if grep -rn "skip: true\|skip:true" test/; then
            echo "::error::A skipped test hides a decision. Delete it or fix it."
            exit 1
          fi

      # Every screen in this room is spoken; the team cannot read. A Text widget is a
      # regression nobody would notice in review, because it looks fine on a developer's
      # laptop and is invisible to the people who use it.
      #
      # The claim code is the one exception the product allows, and it is named here rather
      # than moved out of reach: a screen kept outside this path would be an exception
      # nobody reviewing a diff could see. The team never reads it — a facilitator does,
      # once, at installation, and the screen is gone for good after that.
      - name: The room stays wordless
        run: |
          if grep -rn "Text(" lib/features/sala/presentation/ \
              | grep -v "^lib/features/sala/presentation/widgets/codigo_view.dart:"; then
            echo "::error::A written word reached a team screen."
            exit 1
          fi

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
