name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Provide a .env
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Test
        run: flutter test --reporter expanded --concurrency=2

      # Three skipped tests sat green for weeks, one with an empty body and a reason that
      # had stopped being true. A paused test is a decision, and a decision belongs in a
      # review — not in a suite that reports success.
      - name: No test is quietly skipped
        run: |
          if grep -rn "skip: true\|skip:true" test/; then
            echo "::error::A skipped test hides a decision. Delete it or fix it."
            exit 1
          fi

      - name: Nothing forbidden returns to lib/
        run: dart run tool/check_doctrine.dart

      # The other half of the same guard. `check_doctrine.dart` says no banned mechanism came
      # back into `lib/`; this says the vendored `DOCTRINE.md` still matches its pin, that the
      # pin is one a ruling records, and that every line of the §4 acceptance bar is claimed by
      # a test, held in tripod-backend, or recorded PENDING. It compares recorded sha256s and
      # reads the tree, so it needs no token for a private repository — and the re-pin is
      # deliberately not here: `--sync` is run by hand, against a checkout, when she has ruled.
      - name: Nothing of Marcia's moved without her word
        run: dart run tool/sync_doctrine.dart --check
