name: Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare the version with the previous commit's
        id: version
        run: bash tool/release_gate.sh HEAD~1 HEAD >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: gate
    if: needs.gate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing or invalid. Add the base64-encoded upload keystore as repository secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Write key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Create .env for build
        run: echo 'BACKEND_URL=https://tripod-backend.shemaywam.com' > .env

      - name: Build AAB
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=BUILD_NUMBER=${{ needs.gate.outputs.build_number }}

      - name: Keep the Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-dart-symbols
          path: build/symbols
          retention-days: 90

      - name: Upload to Google Play (production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shema.internalization_room
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
