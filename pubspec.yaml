name: internalization_room
description: "Sala de Internalização — voice-first oral Bible internalization room (Shemá)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  lucide_icons_flutter: ^3.1.15
  path_provider: ^2.1.5
  record: ^6.2.1
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  # Outside ADR 0018's stack list, and deliberately: the room must be able to say it
  # has no connection before the team taps, not only after a request has already failed.
  connectivity_plus: ^6.1.0
  path: ^1.9.0
  # Outside ADR 0018's stack list, like connectivity_plus above it: nothing else can
  # hold the screen, and the team leaves the tablet untouched for minutes at a time.
  # `sdk: ^3.12.0` above already puts the floor past Flutter 3.41.x, which cannot
  # resolve it at all; 3.44.9 is the only toolchain CI verifies (see AGENTS.md).
  wakelock_plus: ^1.7.0
  flutter_secure_storage: ^11.0.0

# path_provider_foundation 2.6.0 pulls objective_c as a native asset, and that
# framework ships ad-hoc signed — iOS rejects the install with
# ApplicationVerificationFailed. Pinned to match oral-collector.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Already pulled in transitively by flutter_secure_storage; named directly because the
  # Keychain vault's test seam (FlutterSecureStoragePlatform.instance) is its type.
  flutter_secure_storage_platform_interface: ^2.0.3
  # Already pulled in transitively; named directly because `tool/sync_doctrine.dart` records
  # a sha256 per vendored artefact, and there is no digest in dart:convert.
  crypto: ^3.0.0
  # Already pulled in transitively by flutter_test; named directly because the offline-drop
  # test drives production's own turn clock through fake_async's Timer control, not just
  # flutter_test's widget-pump scheduling.
  fake_async: ^1.3.3

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#F6F5EB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/pt/
    - assets/audio/pt/fixed/
    - assets/audio/en/
    - assets/audio/en/fixed/
